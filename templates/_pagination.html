{% load i18n %}
{% if is_paginated %}
<div style="display:flex; gap:10px; margin-top:16px;">
    {% if page_obj.has_previous %}
        <a class="button" href="?page={{ page_obj.previous_page_number }}">{% trans "Назад" %}</a>
    {% endif %}
    <span class="help-text">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
        <a class="button" href="?page={{ page_obj.next_page_number }}">{% trans "Далее" %}</a>
    {% endif %}
</div>
{% endif %}
