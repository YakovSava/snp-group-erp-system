services:
  ai_db:
    image: postgres:16-alpine
    restart: unless-stopped
    # env_file alone (no `environment:` block): env_file injects these vars
    # straight into the container, bypassing Compose's own ${VAR} YAML
    # interpolation entirely. That interpolation is NOT reliably scoped to
    # this included file's own .env (it was observed resolving against the
    # root project's .env instead, silently initializing this database with
    # auto-smm's Postgres password rather than ai-assistant's own) — so any
    # ${POSTGRES_*} here would risk the same collision.
    env_file: .env
    volumes:
      - ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $POSTGRES_USER/$POSTGRES_DB here are shell-expanded inside the
      # container at healthcheck-run time (from the env_file-injected vars
      # above), not Compose-YAML-interpolated — same collision-avoidance
      # reasoning as above.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/app/chroma_data
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      ai_db:
        condition: service_healthy

volumes:
  ai_postgres_data:
  chroma_data:
  media_data:
